name: Daily Neon Backup to GitHub Releases

on:
  schedule:
    # 02:00 AM hora de Perú (07:00 UTC) todos los días
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutar el backup manualmente

permissions:
  contents: write # Permiso para que GitHub Actions pueda crear Releases

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 Client Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

      - name: Generate Database Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          BACKUP_NAME="neondb_backup_$(date +'%Y%m%d_%H%M%S').dump"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" -Fc -f "$BACKUP_NAME"
          echo "BACKUP_FILE=$BACKUP_NAME" >> $GITHUB_ENV

      - name: Publish Backup to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="backup-$(date +'%Y%m%d_%H%M%S')"
          gh release create "$TAG_NAME" "$BACKUP_FILE" \
            --title "Neon DB Backup - $(date +'%Y-%m-%d %H:%M:%S UTC')" \
            --notes "Backup automático diario de la base de datos Neon PostgreSQL."
